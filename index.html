<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SakuQ - Hemat & Nabung Seru</title>
  <link rel="stylesheet" href="style.css?v=6">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
  <div class="app-container">
    <!-- Header Utama -->
    <header class="app-header">
      <div class="logo">
        <span class="logo-icon">👛</span>
        <h1>SakuQ</h1>
      </div>
      
      <div class="header-actions">
        <button id="themeToggleBtn" class="theme-btn" title="Ubah Tema">🌙</button>
        <div class="streak-badge" id="streakBadge" title="Streak Hari Hemat">
          🔥 <span id="streakCount">0</span> Hari
        </div>
      </div>
    </header>

    <!-- TAB 1: BERANDA -->
    <main id="tabHome" class="tab-content active-tab">
      <!-- Ringkasan Saku -->
      <section class="card summary-card">
        <h2>Ringkasan Saku</h2>
        <div class="grid-2">
          <div class="stat-box">
            <small>Sisa Jajan Hari Ini</small>
            <div class="stat-value" id="dailyBudgetDisplay">Rp 0</div>
          </div>
          <div class="stat-box">
            <small>Total Tabungan</small>
            <div class="stat-value highlight" id="totalSavingsDisplay">Rp 0</div>
          </div>
        </div>
        
        <!-- Progress Bar Target -->
        <div class="target-section">
          <div class="target-header">
            <span>Target: <strong id="targetNameDisplay">Belum Ada Target</strong></span>
            <div>
              <span id="targetAmountDisplay" style="font-weight: bold; margin-right: 8px;">Rp 0 / Rp 0</span>
              <span id="targetProgressPercent">0%</span>
            </div>
          </div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="targetProgressBar" style="width: 0%;"></div>
          </div>
        </div>
      </section>

      <!-- Form Catat Pengeluaran -->
      <section class="card">
        <h3>Catat Pengeluaran</h3>
        <form id="expenseForm" class="form-group">
          <label for="expenseTitle">Nama Pengeluaran</label>
          <input type="text" id="expenseTitle" placeholder="Misal: Es Boba" required>

          <label for="expenseAmount">Nominal</label>
          <input type="text" id="expenseAmount" inputmode="numeric" placeholder="Rp 0" required>

          <button type="submit" class="btn btn-action">Simpan Pengeluaran</button>
        </form>
      </section>
    </main>

    <!-- TAB 2: TARGET & BADGES -->
    <main id="tabSettings" class="tab-content">
      <!-- Form Target Impian -->
      <section class="card">
        <h3>Target Impian</h3>
        <form id="targetForm" class="form-group">
          <label for="targetNameInput">Nama Target</label>
          <input type="text" id="targetNameInput" placeholder="Misal: Sepatu Baru" required>

          <label for="targetAmountInput">Nominal Target</label>
          <input type="text" id="targetAmountInput" inputmode="numeric" placeholder="Rp 0" required>

          <label for="targetLinkInput">Link Produk (Opsional)</label>
          <input type="url" id="targetLinkInput" placeholder="https://tokopedia.com/...">

          <button type="submit" class="btn btn-primary">Simpan Target</button>
        </form>
      </section>

      <!-- Form Uang Saku -->
      <section class="card">
        <h3>Atur Uang Saku</h3>
        <form id="allowanceForm" class="form-group">
          <label for="allowanceInput">Nominal Uang Saku</label>
          <input type="text" id="allowanceInput" inputmode="numeric" placeholder="Rp 0" required>

          <label for="periodSelect">Periode</label>
          <select id="periodSelect">
            <option value="1">Harian (1 Hari)</option>
            <option value="7" selected>Mingguan (7 Hari)</option>
            <option value="30">Bulanan (30 Hari)</option>
          </select>

          <label for="autoSavePercent">Auto-Save (%)</label>
          <input type="number" id="autoSavePercent" value="10" min="0" max="50">

          <button type="submit" class="btn btn-action">Simpan Uang Saku</button>
        </form>
      </section>

      <!-- Badges -->
      <section class="card">
        <h3>Lencana Pencapaian</h3>
        <div class="badges-grid" id="badgesContainer"></div>
      </section>

      <!-- Riwayat Transaksi -->
      <section class="card">
        <h3>Riwayat Pengeluaran</h3>
        <ul class="history-list" id="historyList">
          <li class="empty-msg">Belum ada pengeluaran dicatat.</li>
        </ul>
        <button id="resetDataBtn" class="btn btn-danger">Reset Semua Data</button>
      </section>
    </main>

    <!-- NAVIGASI TAB BAWAH -->
    <nav class="bottom-nav">
      <button class="nav-item active" id="navHomeBtn">
        <span class="nav-icon">🏠</span>
        <span class="nav-label">Beranda</span>
      </button>
      <button class="nav-item" id="navSettingsBtn">
        <span class="nav-icon">🎯</span>
        <span class="nav-label">Target & Badges</span>
      </button>
    </nav>
  </div>

  <script src="script.js"></script>
</body>
</html>
